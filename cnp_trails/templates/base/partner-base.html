     {% block content %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    const partnerType = document.getElementById('id_partner_type');
    const companyInput = document.getElementById('id_company_name');
    const companyField = companyInput.closest('.form-group') || companyInput.parentElement;

    function toggleCompanyField() {
        if (partnerType.value === 'Register as Individual') {
            companyField.style.display = 'none';
            companyInput.value = '';
            companyInput.disabled = true;
        } else {
            companyField.style.display = 'block';
            companyInput.disabled = false;
            companyInput.value = '';
        }
    }

    partnerType.addEventListener('change', toggleCompanyField);
    toggleCompanyField();
});
</script>
